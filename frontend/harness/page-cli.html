<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>ui-harness-cli</title>
</head>
<body>
<div id="root"></div>
<script src="/node_modules/react/umd/react.development.js"></script>
<script src="/node_modules/react-dom/umd/react-dom.development.js"></script>
<script src="/node_modules/dayjs/dayjs.min.js"></script>
<script src="/node_modules/antd/dist/antd.min.js"></script>
<script>
// 宿主 mock（同 page-env.html 模式）+ Coding CLI 数据面 mock。
// scen: full | l2 | 404 | fail
window.QwenPaw = {
  host: {
    React: window.React,
    antd: window.antd,
    getApiUrl: (p) => p,
    getApiToken: () => "",
  },
};

const scen =
  new URLSearchParams(location.search).get("scen") || "full";

window.__INSTALLS__ = [];   // {cli, action, version?}
window.__SETTINGS_PUTS__ = []; // {cli, patch}
window.__TASK_CALLS__ = 0;
window.__LIST_CALLS__ = 0;
window.__TASK_STATE__ = "running"; // 驱动可改为 done/failed

function okJson(data, status) {
  const s = JSON.stringify(data);
  return {
    ok: true,
    status: status || 200,
    text: async () => s,
    json: async () => data,
  };
}
function errJson(status, detail) {
  const s = JSON.stringify({ detail });
  return {
    ok: false,
    status,
    text: async () => s,
    json: async () => JSON.parse(s),
  };
}

const LIST_BODY = {
  "qwen-code": {
    cli: "qwen-code",
    installed: true,
    version: "0.25.0",
    auth: { configured: true, method: "apiKey" },
  },
  opencode: { cli: "opencode", installed: false, auth: null },
  qoder: { cli: "qoder", installed: false, auth: { configured: false } },
};

// 真实 API 形状（{cli,path,exists,settings}）——15.31 修：原裸 settings
// 对象被 getCliSettings 防御解包成空树，S4 断言全盲。
const SETTINGS_BODY = {
  cli: "qwen-code",
  path: "~/.qwen/settings.json",
  exists: true,
  settings: {
    model: { name: "m1" },
    security: { auth: { apiKey: { redacted: true, has_value: true } } },
    tools: { useRipgrep: true },
  },
};

// 15.31 场景：seed=空态（全新 CLI）；routes=15.31 全结构（model 对象 +
// modelProviders 路由数组 + 各顶层段）。
const SETTINGS_SEED_BODY = { cli: "qwen-code", path: "", exists: false, settings: {} };
const SETTINGS_ROUTES_BODY = {
  cli: "qwen-code",
  path: "~/.qwen/settings.json",
  exists: true,
  settings: {
    model: { name: "m1", reasoningEffort: "high", generationConfig: { timeout: 120000 } },
    fastModel: "m-fast",
    modelProviders: {
      openai: [
        { id: "q1", name: "One", envKey: "OPENAI_API_KEY", baseUrl: "http://a:1/v1" },
        { id: "q2", name: "Two", envKey: "OPENAI_API_KEY", baseUrl: "http://b:2/v1" },
      ],
    },
    tools: { approvalMode: "auto", shell: { defaultTimeoutMs: 120000 } },
    permissions: { allow: ["Bash"], ask: [], deny: [] },
    context: { autoCompactThreshold: 0.85 },
    mcp: { allowed: ["srv1"], excluded: [] },
    security: {
      folderTrust: { enabled: false },
      auth: { selectedType: "openai", apiKey: { redacted: true, has_value: true } },
    },
    telemetry: { enabled: false },
    general: { enableAutoUpdate: false },
    ui: { theme: "Qwen Dark" },
  },
};

const origFetch = window.fetch.bind(window);
window.fetch = (url, opts) => {
  const u = String(url);
  const m = opts || {};
  const method = (m.method || "GET").toUpperCase();
  const B = "/agentteams-proxy/controller/api/v1/workers/w1/coding-cli";

  if (u === B) {
    window.__LIST_CALLS__ += 1;
    if (scen === "404") return Promise.resolve(errJson(404, "not found"));
    return Promise.resolve(okJson(LIST_BODY));
  }

  if (u === B + "/qwen-code/settings" && method === "GET") {
    const body =
      scen === "seed"
        ? SETTINGS_SEED_BODY
        : scen === "routes"
          ? SETTINGS_ROUTES_BODY
          : SETTINGS_BODY;
    return Promise.resolve(okJson(body));
  }
  if (u === B + "/qwen-code/settings" && method === "PUT") {
    if (scen === "l2") return Promise.resolve(errJson(403, "forbidden"));
    const patch = JSON.parse(m.body);
    window.__SETTINGS_PUTS__.push({ cli: "qwen-code", patch });
    return Promise.resolve(okJson({}));
  }
  // 15.33：opencode settings 路由（真实 API 对任意 CLI 可读写——卡片化后
  // 展开 opencode 卡即自动 GET；原 mock 只有 qwen-code，切卡必 404）。
  if (u === B + "/opencode/settings" && method === "GET") {
    return Promise.resolve(
      okJson({
        cli: "opencode",
        path: "~/.config/opencode/opencode.json",
        exists: true,
        settings: { model: "m-oc", snapshot: true },
      }),
    );
  }
  if (u === B + "/opencode/settings" && method === "PUT") {
    if (scen === "l2") return Promise.resolve(errJson(403, "forbidden"));
    const patch = JSON.parse(m.body);
    window.__SETTINGS_PUTS__.push({ cli: "opencode", patch });
    return Promise.resolve(okJson({}));
  }

  if (u === B + "/opencode/install" && method === "POST") {
    const req = JSON.parse(m.body);
    window.__INSTALLS__.push({
      cli: "opencode",
      action: req.action,
      version: req.version,
    });
    return Promise.resolve(okJson({ task_id: "T1", state: "running" }, 202));
  }

  if (u === B + "/qwen-code/install" && method === "POST") {
    const req = JSON.parse(m.body);
    window.__INSTALLS__.push({
      cli: "qwen-code",
      action: req.action,
      version: req.version,
    });
    return Promise.resolve(okJson({ task_id: "T2", state: "running" }, 202));
  }

  if (/\/install\/T[12]$/.test(u) && method === "GET") {
    window.__TASK_CALLS__ += 1;
    const state = window.__TASK_STATE__;
    return Promise.resolve(
      okJson({
        task_id: u.split("/").pop(),
        state,
        exit_code: state === "done" ? 0 : undefined,
        stderr_tail: state === "failed" ? "boom: no network" : undefined,
      }),
    );
  }

  return origFetch(url, opts);
};
</script>
<script src="/harness/bundle-cli.js"></script>
</body>
</html>
