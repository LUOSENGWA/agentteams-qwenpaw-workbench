<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>ui-harness-cr</title>
</head>
<body>
<div id="root"></div>
<script src="/node_modules/react/umd/react.development.js"></script>
<script src="/node_modules/react-dom/umd/react-dom.development.js"></script>
<script src="/node_modules/dayjs/dayjs.min.js"></script>
<script src="/node_modules/antd/dist/antd.min.js"></script>
<script>
// 宿主 mock：React/antd 实例 + 空壳 API（entry 不执行 index.tsx，直接挂组件）。
window.QwenPaw = {
  host: {
    React: window.React,
    antd: window.antd,
    getApiUrl: (p) => p,
    getApiToken: () => "",
  },
};

// 场景由 URL ?scen= 控制：list（默认，3 条 v2 run）/ empty / 404
window.__CR_SCENARIO__ =
  new URLSearchParams(location.search).get("scen") || "list";

function okJson(data) {
  const s = JSON.stringify(data);
  return {
    ok: true,
    status: 200,
    text: async () => s,
    json: async () => data,
  };
}
function errJson(status, detail) {
  const s = JSON.stringify({ detail });
  return {
    ok: false,
    status,
    text: async () => s,
    json: async () => ({ detail }),
  };
}

window.fetch = async (url) => {
  const u = String(url);
  // 详情：GET /api/v1/coding-runs/{task}/runs/{run}?format=json
  if (u.includes("/api/v1/coding-runs/") && u.includes("/runs/")) {
    return okJson({
      task_id: "task-1",
      run: "run-20261016-120000.log",
      team: "t1",
      meta: {
        cli: "claude",
        worker: "w1",
        runner: "docker",
        status: "ok",
        exit_code: 0,
        started_at: "2026-10-16T12:00:00Z",
        ended_at: "2026-10-16T12:03:00Z",
        log_bytes: 2048,
        prompt_sha256: "abc123",
      },
      input: {
        prompt_available: true,
        prompt: "please do the thing\nsecond line",
      },
      output: {
        transcript: "line one\nline two\nDONE",
        status: "ok",
        exit_code: 0,
      },
    });
  }
  // 列表：GET /api/v1/coding-runs
  if (u.includes("/api/v1/coding-runs")) {
    const s = window.__CR_SCENARIO__;
    if (s === "empty") return okJson([]);
    if (s === "404") return errJson(404, "no coding run storage");
    return okJson([
      {
        task_id: "task-1",
        run: "run-20261016-120000.log",
        team: "t1",
        cli: "claude",
        worker: "w1",
        status: "ok",
        exit_code: 0,
        started_at: "2026-10-16T12:00:00Z",
        log_bytes: 2048,
      },
      {
        task_id: "task-2",
        run: "run-20261015-090000.log",
        cli: "codex",
        worker: "w2",
        status: "error",
        exit_code: 1,
        log_bytes: 1024,
      },
      {
        task_id: "task-3",
        run: "run-20261015-080000.log",
        team: "t2",
        status: "timeout",
      },
    ]);
  }
  return errJson(404, "not found (harness)");
};
</script>
<script src="/harness/bundle-cr.js"></script>
</body>
</html>
