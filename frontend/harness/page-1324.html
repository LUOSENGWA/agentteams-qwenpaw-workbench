<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>ui-harness-13.24</title>
</head>
<body>
<div id="root"></div>
<script src="/node_modules/react/umd/react.development.js"></script>
<script src="/node_modules/react-dom/umd/react-dom.development.js"></script>
<script src="/node_modules/dayjs/dayjs.min.js"></script>
<script src="/node_modules/antd/dist/antd.min.js"></script>
<script>
// 宿主 mock：React/antd 实例 + 空壳 API（entry 不执行 index.tsx，直接挂组件）。
window.QwenPaw = {
  host: {
    React: window.React,
    antd: window.antd,
    getApiUrl: (p) => p,
    getApiToken: () => "",
  },
};

function okJson(data) {
  const s = JSON.stringify(data);
  return { ok: true, status: 200, text: async () => s, json: async () => data };
}
function errJson(status, detail) {
  const s = JSON.stringify({ detail });
  return { ok: false, status, text: async () => s, json: async () => ({ detail }) };
}

window.fetch = async (url, init) => {
  const u = String(url);
  const m = init || {};
  const method = String(m.method || "GET").toUpperCase();
  let bodyObj = null;
  if (m.body) {
    try { bodyObj = JSON.parse(typeof m.body === "string" ? m.body : "{}"); }
    catch { bodyObj = null; }
  }

  // A4 F3：WRC 内嵌 ApprovalControl 走 #1216 主路径（w-f3 = AUTO 200）
  const ap = u.match(/api\/v1\/workers\/([^/]+)\/approval/);
  if (ap) {
    const n = decodeURIComponent(ap[1]);
    if (n === "w-f3" && method === "GET") return okJson({ approval_level: "AUTO" });
    if (n === "w-f3" && method === "PUT") {
      return okJson({ approval_level: bodyObj && bodyObj.approval_level });
    }
    return errJson(404, "endpoint not found (old controller)");
  }

  // A4 F3：WRC runtime-config（w-f3 = 200 最小配置 → tab 渲染）
  if (u.includes("/workers/w-f3/runtime-config")) {
    return okJson({
      model: { name: "qwen3.6-27b-fp8" },
      max_iters: 10,
      enable_reme: false,
    });
  }
  // WRC loops 目录（空）
  if (u.includes("/workers/w-f3/loops")) return okJson({ modes: [] });

  // A3 F6：CrdManage openCfg 的模型候选（sglang 在服模型）
  if (u.includes("/sglang/models")) {
    return okJson({ models: ["model-new-a", "model-new-b"] });
  }
  // 网关 alias（无会话——CrdManage 容错 available=false）
  if (u.includes("/gateway/ai-routes")) {
    return okJson({ available: false, detail: "no higress console session (harness)" });
  }
  if (u.includes("/gateway/ai-providers")) {
    return okJson({ available: false, detail: "no higress console session (harness)" });
  }

  // SkillCenter（modal 内嵌）目录拉取——404 空态可接受（断言在技能区之外）
  return errJson(404, "not found (harness)");
};
</script>
<script src="/harness/bundle-1324.js"></script>
</body>
</html>
