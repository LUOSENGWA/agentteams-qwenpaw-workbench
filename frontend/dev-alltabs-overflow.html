const qs = new URLSearchParams(location.search);
const TAB = qs.get("tab") || "home";
const AUDIT_W = parseInt(qs.get("w") || "390", 10);

// ── 审计视口 = 真实插件容器宽（window.innerWidth 等价）──
document.getElementById("audit-viewport").style.width = AUDIT_W + "px";

// ── 触屏 44px 档复现：?touch=1 → html.wb-touch（与 index.tsx 模块级
// matchMedia 检测同款类；桌面 chromium 探针无 coarse 指针，手动加类
// 复现 44px 全局档，配 TOUCH_CSS 镜像测量达标率）──
if (qs.get("touch") === "1") {
  document.documentElement.classList.add("wb-touch");
}

// ── 审计保真：mock matchMedia 为固定视口宽（antd xs/sm/md/lg 断点走 matchMedia；
// 与 dev-manage-overflow.html 同款）──
const origMM = window.matchMedia.bind(window);
window.matchMedia = (q) => {
  const m = origMM(q);
  const minM = q.match(/min-width:\s*([0-9.]+)px/);
  const maxM = q.match(/max-width:\s*([0-9.]+)px/);
  let matches = m.matches;
  if (minM) matches = AUDIT_W >= parseFloat(minM[1]);
  else if (maxM) matches = AUDIT_W <= parseFloat(maxM[1]);
  return {
    ...m,
    matches,
    addEventListener: () => {},
    removeEventListener: () => {},
    addListener: () => {},
    removeListener: () => {},
    dispatchEvent: () => false,
  };
};

async function mockFetch(path, init) {
  const url = String(path || "").split("?")[0];
  const full = String(path || "");
  FETCH_LOG.push(full);
  for (const [re, bodyFn] of ROUTES) {
    if (re.test(full) || re.test(url)) {
      const body = bodyFn(full);
      return new Response(JSON.stringify(body), {
        status: 200,
        headers: { "Content-Type": "application/json" },
      });
    }

}

function scrollXAncestorOf(node, stopEl) {
  let n = node.parentElement;
  while (n && n !== stopEl && n !== document.body) {
    const cs = getComputedStyle(n);
    if (cs.overflowX === "auto" || cs.overflowX === "scroll") return n;
    n = n.parentElement;
  }
  return null;
}

function clipXAncestorOf(node, stopEl) {
  let n = node.parentElement;
  while (n && n !== stopEl && n !== document.body) {
    const cs = getComputedStyle(n);
    if (cs.overflowX === "hidden" || cs.overflowX === "clip") return n;
    n = n.parentElement;
  }
  return null;
}

function desc(el2) {
  const cls = (el2.className && el2.className.toString ? el2.className.toString() : "")
    .trim().split(/\s+/).filter((c) => c && !/^ant-|^qwenpaw-/.test(c) || /^ant-(table|tabs|card|modal|drawer|tag|btn|badge)$/.test(c)).slice(0, 3).join(".");
  const txt = (el2.textContent || "").trim().replace(/\s+/g, " ").slice(0, 36);
  const id = el2.id ? "#" + el2.id : "";
  return `${el2.tagName.toLowerCase()}${id}${cls ? "." + cls : ""} :: ${txt || "(empty)"}`;
}

setTimeout(() => {
  const vp = document.getElementById("audit-viewport");
  const main = vp.querySelector(".wb-main");
  const content = vp.querySelector(".wb-content");
  const contentRect = content ? content.getBoundingClientRect() : null;
  const contentRight = contentRect ? contentRect.right : Infinity;

  const lines = [];
  const beyondContent = [];
  const beyondViewport = [];
  const scrollables = [];

  vp.querySelectorAll("*").forEach((elm) => {
    const r = elm.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) return;
    const inContent = content && content.contains(elm);
    // 边界 A：内容容器右缘
    if (contentRect && inContent && r.right > contentRight + 2) {
      const anc = scrollXAncestorOf(elm, content);
      const clip = anc ? null : clipXAncestorOf(elm, content);
      const tag2 = anc ? `FP(scroll-anc=${desc(anc).slice(0, 60)})` : clip ? "CLIPPED(overflow-x:hidden anc)" : "TRUE";
      beyondContent.push(`${tag2} right=${Math.round(r.right)}(+${Math.round(r.right - contentRight)}) w=${Math.round(r.width)} ${desc(elm)}`);
    }
    // 边界 B：视口右缘（tab 栏/header/portal 外的越界）
    // 2026-10-19 口径修正（与边界 A 对称）：overflow-x:hidden/clip 祖先会
    // 裁切子元素——被裁掉的超出部分在视口上不可见（实例：antd Switch 的
    // 预定位隐藏 label 用 ml:68/mr:-68 过渡定位技巧，行右对齐瞬态时可越
    // 视口右缘但被 .wb-content 全裁，ops@768 瞬态 TRUE 即此）→ 判
    // CLIPPED 不计 TRUE。扫描器口径变化，非改判基线（见 05 报告 §5）。
    if (r.right > AUDIT_W + 2) {
      const anc = scrollXAncestorOf(elm, vp);
      const clip = anc ? null : clipXAncestorOf(elm, vp);
      const tag2 = anc ? `FP(scroll-anc=${desc(anc).slice(0, 60)})` : clip ? "CLIPPED(overflow-x:hidden anc)" : "TRUE";
      beyondViewport.push(`${tag2} right=${Math.round(r.right)}(+${Math.round(r.right - AUDIT_W)}) w=${Math.round(r.width)} ${desc(elm)}${inContent ? "" : " (outside-content)"}`);
    }
    // 设计内横滚容器量化（sw > cw）
    const cs = getComputedStyle(elm);
    if ((cs.overflowX === "auto" || cs.overflowX === "scroll") && elm.scrollWidth > elm.clientWidth + 2) {
      scrollables.push(`${desc(elm).slice(0, 80)} sw=${elm.scrollWidth} cw=${elm.clientWidth}(+${elm.scrollWidth - elm.clientWidth})`);
    }
  });

  const widest = [...vp.querySelectorAll("*")]
    .filter((elm) => elm.scrollWidth > 250)
    .map((elm) => {
      const anc = scrollXAncestorOf(elm, vp);
      return { sw: elm.scrollWidth, anc: !!anc, line: `sw=${elm.scrollWidth} ${anc ? "FP" : "TRUE"} ${desc(elm)}` };
    })
    .sort((a, b) => b.sw - a.sw)
    .slice(0, 15)
    .map((x) => x.line);

  const htmlLen = (vp.querySelector("#root").innerHTML || "").length;
  const out = [];
  out.push(`AUDIT tab=${TAB} viewport=${AUDIT_W}px mode=${VP.narrow ? "NARROW" : "WIDE"} contentLeft=${contentRect ? Math.round(contentRect.left) : "-"} contentRight=${contentRight === Infinity ? "-" : Math.round(contentRight)} mainW=${main ? main.clientWidth : "-"}`);
  out.push("=== RENDER ===");
  out.push(`state=${PAGE_ERRORS.length ? "ERROR" : "OK"} rootHtmlLen=${htmlLen}${PAGE_ERRORS.length ? "\n" + PAGE_ERRORS.slice(0, 5).map((e) => "ERR: " + e.slice(0, 300)).join("\n") : ""}`);
  out.push("=== FETCH (host.fetch 命中/404) ===");
  const uniqPaths = [...new Set(FETCH_LOG.map((p) => p.split("?")[0]))];
  out.push(uniqPaths.length ? uniqPaths.join(" | ") : "(none)");
  out.push(`=== SCROLLABLE by-design (sw>cw, ${scrollables.length}) ===`);
  out.push(scrollables.slice(0, 20).join("\n") || "(none)");
  out.push(`=== BEYOND content-right (${beyondContent.length}) ===`);
  out.push(beyondContent.slice(0, 40).join("\n") || "NONE");
  out.push(`=== BEYOND viewport-right (${beyondViewport.length}) ===`);
  out.push(beyondViewport.slice(0, 40).join("\n") || "NONE");
  out.push("=== WIDEST (scrollWidth>250, top15) ===");
  out.push(widest.join("\n") || "(none)");

  document.getElementById("scan-out").textContent = out.join("\n");
}, 4500);
</script>
</body>
