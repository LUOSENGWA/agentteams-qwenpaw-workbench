    make: (m) => ({

    }),

function routeLookup(path) {
  const clean = path.split("?")[0];
  if (ROUTES[clean] !== undefined) return ROUTES[clean];
  for (const d of DYNAMIC) {
    const m = clean.match(d.re);
    if (m) return d.make(m);
  }
  return null;
}

// ── 宿主 mock（与 dev-manage-overflow.html 同款注入法）──────────────

    env: { kind: "server", caps: { net: false, secureStore: false, notify: false } },

      const body = routeLookup(String(path));

// SSE：WorkbenchPage 用原生 fetch 开 /agentteams-proxy/events 流。
// mock = 永不结束的 keepalive 流 → sseState=connected（与真宿主等效）。
const origFetch = window.fetch.bind(window);
window.fetch = (input, init) => {
  const url = String(typeof input === "string" ? input : input.url);
  if (url.includes("/agentteams-proxy/events")) {
    const enc = new TextEncoder();
    const stream = new ReadableStream({
      start(c) {
        c.enqueue(enc.encode(": keepalive\n\n"));
        const t = setInterval(() => c.enqueue(enc.encode(": keepalive\n\n")), 15000);
        stream.cancel = () => clearInterval(t);
      },
    });
    return Promise.resolve({
      ok: true, status: 200, body: stream,
      headers: new Headers({ "content-type": "text/event-stream" }),
    });
  }
  return origFetch(input, init);
};
